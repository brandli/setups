name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'  # Trigger on all branches
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image name and tag from branch
      id: image-info
      run: |
        # Get the branch name and remove 'refs/heads/' prefix
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        
        # Replace any invalid Docker tag characters with hyphens
        CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
        
        # Check if branch name contains a slash (name/tag format)
        if [[ "$CLEAN_BRANCH" == *"/"* ]]; then
          # Split on the first slash: name/tag -> name:tag
          IMAGE_NAME_PART=$(echo "$CLEAN_BRANCH" | cut -d'/' -f1)
          TAG_PART=$(echo "$CLEAN_BRANCH" | cut -d'/' -f2-)
          FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository_owner }}/${IMAGE_NAME_PART}"
          IMAGE_TAG="$TAG_PART"
        else
          # Use branch name as tag with default image name
          FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="$CLEAN_BRANCH"
        fi
        
        # For main/master branch, also tag as 'latest'
        if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
          TAGS="$FULL_IMAGE_NAME:$IMAGE_TAG,$FULL_IMAGE_NAME:latest"
        else
          TAGS="$FULL_IMAGE_NAME:$IMAGE_TAG"
        fi
        
        echo "image-name=$FULL_IMAGE_NAME" >> $GITHUB_OUTPUT
        echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "tags=$TAGS" >> $GITHUB_OUTPUT
        
        echo "🐳 Will build image: $FULL_IMAGE_NAME:$IMAGE_TAG"
        echo "📋 All tags: $TAGS"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: development  # Build the development target
        push: true
        tags: ${{ steps.image-info.outputs.tags }}
        labels: |
          org.opencontainers.image.title=OCB 18.0 Development
          org.opencontainers.image.description=Odoo Community Backports 18.0 development environment
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image build summary
      run: |
        echo "✅ Successfully built and pushed:"
        echo "📦 Image: ${{ steps.image-info.outputs.image-name }}"
        echo "🏷️  Tag: ${{ steps.image-info.outputs.image-tag }}"
        echo "🔗 Full tags: ${{ steps.image-info.outputs.tags }}"
        echo ""
        echo "To pull this image:"
        echo "docker pull ${{ steps.image-info.outputs.image-name }}:${{ steps.image-info.outputs.image-tag }}"
