version: '3.8'

services:
  # OCB Development Container
  app:
    image: ocb-dev:latest
    volumes:
      # Mount the workspace
      - ..:/workspace:cached
      # Mount custom addons directory
      - ../custom-addons:/opt/odoo/custom-addons:cached
      # Persist Odoo data
      - odoo-data:/opt/odoo/data
      # Persist logs
      - odoo-logs:/var/log/odoo
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=odoo
      - ODOO_ADMIN_PASSWD=admin
      - ODOO_DB=odoo
      - LOG_LEVEL=info
      - WORKERS=0
    ports:
      - "8069:8069"
    depends_on:
      - db
    command: sleep infinity  # Keep container running for dev
    # Alternative: Start Odoo directly
    # command: ["/opt/odoo/start-odoo.sh"]

  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
  odoo-data:
  odoo-logs:
